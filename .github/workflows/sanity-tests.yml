name: Sanity Tests

# Runs the P0 acceptance test suite (acceptance_tests/sanity.list) as the
# pull request gate.
on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sanity:
    name: P0 Sanity Suite
    runs-on: ubuntu-latest
    timeout-minutes: 200

    env:
      TF_VAR_auth_token: ${{ secrets.CAPELLA_AUTH_TOKEN }}
      TF_VAR_organization_id: ${{ secrets.CAPELLA_ORGANIZATION_ID }}
      TF_VAR_host: ${{ secrets.CAPELLA_HOST }}
      CAPELLA_OPENAPI_SPEC_PATH: ${{ github.workspace }}/openapi.generated.yaml

    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Go
        
        uses: actions/setup-go@v4
        with:
          go-version-file: 'go.mod'
          cache: true
        id: go
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.9
          terraform_wrapper: false
      - name: Run sanity tests
        run: make testacc-sanity
